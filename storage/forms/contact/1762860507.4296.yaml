user_message: "Sehr geehrte Damen und Herren\r\n\r\nIch bin auf der Suche nach einem passenden Treuhandbüro, das unser Startup in der Schweiz unterstützen kann.\r\nWir sind derzeit zwei Mitarbeiter in der Schweiz und befinden uns im Prozess der Eröffnung eines neuen Büros in Prishtina (Kosovo).\r\n\r\nAktuell betreuen wir zwei Kunden und erzielen einen monatlichen Umsatz von rund CHF 30’000–40’000. Für das Jahr 2025 erwarten wir kein starkes Wachstum, da wir derzeit stark in die Weiterentwicklung unserer Software investiert sind.\r\n\r\nGerne würde ich mehr über Ihre Dienstleistungen und Konditionen erfahren, insbesondere in den Bereichen Buchhaltung, Jahresabschluss und steuerliche Beratung.\r\n\r\nIch freue mich auf Ihre Rückmeldung.\r\n\r\nFreundliche Grüsse\r\nAdrian Ajvazaj"
