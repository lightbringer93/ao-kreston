user_message: "Gruezi, \r\nWir haben mit Hilfe von Frau Nathalie Sipzer unsere Lohnsteuererklaerungen gemacht, seit ein Paar Jahren (ca 3).  Ich habe ihr alle Dokumenten für 2023 zukommen lassen, allerdings ohne irgendwelche Antwort (von Ihr oder Kreston selbe - sehr ungewöhnlich).  Deshalb nehme ich Kontakt Direkt mit Kreston auf, um herauszufinden ob Frau Sipzer noch bei Kreston arbeitet, oder wem sonst mit uns eine Erklärungen fertigen könnte bitte.\r\nVielen Dank und Gruesse\r\nAlex & Sibylle Lane"
