user_message: "Dear Sir/Madam,\r\n\r\nWe currently have a client planning to register two companies in Switzerland, both structured as Limited Liability Companies (GmbH) with actual operations and staff in the future. Details are as follows:\r\n\r\nFirst Company (Ticket Sales Platform):\r\n\r\nBusiness: A platform similar to Ctrip for selling boat tickets, leasing vessel slots from shipbuilding companies, and selling directly to tourists or agents (like Ctrip). Operations will span two river routes in Europe, not limited to Switzerland.\r\nOwnership: 100% owned by a Chinese company.\r\nInvestment: €2 million (not equivalent to registered capital; the client intends to set the minimum registered capital for now).\r\nAddress: Will use your virtual address service during the initial registration phase, if available.\r\nSecond Company (Shipbuilding Joint Venture):\r\n\r\nBusiness: A joint venture with a local Swiss company, focusing on shipbuilding.\r\nOwnership: 50% owned by the first company, 50% by the local Swiss company.\r\nInvestment: €8 million (not equivalent to registered capital; the client intends to set the minimum registered capital for now).\r\nAddress: Will also use your virtual address service during the initial registration phase, if available.\r\nWe would like to inquire about the following for both the ticket sales and shipbuilding companies:\r\n\r\nRegistration Costs: What are the total costs, including bank account opening, registration service fees, government fees, notarization fees, and any other potential expenses?\r\nShareholder and Director Requirements: What are the requirements for shareholders and directors? Specifically, we understand at least one director must be a Swiss resident—can you confirm?\r\nNominee Director Service: Do you provide nominee director services to fulfill the residency requirement? If so, how much is the fee?\r\nVirtual Address: Can the ticket sales company (and shipbuilding company) use your virtual address for registration? What are the associated costs?\r\nOperating Licenses: Are there any specific licenses required for operating a ticket sales platform and a shipbuilding company, especially considering the ticket sales company will operate across European river routes?\r\nWe look forward to your detailed response to proceed with the registration process."
