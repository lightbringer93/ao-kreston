user_message: "[11:50, 18/02/2025] ablumbergs: Šitā?\r\n[16:47, 18/02/2025] ablumbergs: Sehr geehrte Damen und Herren,\r\n\r\nIch hoffe, diese E-Mail erreicht Sie wohlbehalten.\r\n\r\nWir befinden uns derzeit im Prozess der Umwandlung unseres in Zürich ansässigen Unternehmens von einer GmbH in eine AG, durch eine Kapitalerhöhung sowie eine Änderung des Firmennamens und des Geschäftszwecks, während die bestehende CHE-Nummer beibehalten wird. Wir haben diesen Prozess bereits mit einem Notar in Zürich eingeleitet und befinden uns derzeit in der Finalisierung der rechtlichen Dokumentation.\r\n\r\nIm Rahmen der erforderlichen Schritte benötigen wir nun einen Revisor, der die Umwandlung gemäß den schweizerischen Vorschriften prüft und bestätigt. Daher suchen wir ein Unternehmen, das diesen Service anbietet, und würden uns über weitere Informationen zu folgenden Punkten freuen:\r\n\r\nBieten Sie Revisionsdienstleistungen für die Umwandlung von GmbH in AG an?\r\nWie lange dauert die Prüfung voraussichtlich?\r\nWie hoch sind Ihre Gebühren für diesen Service?\r\nBitte lassen Sie uns Ihre Verfügbarkeit und Preise per E-Mail wissen. Alternativ können Sie mich direkt unter +41 76 215 52 65 kontaktieren (Englischsprachig, kein Deutsch).\r\n\r\nIch freue mich auf Ihre Rückmeldung.\r\n\r\nMit freundlichen Grüßen,\r\nArturs Blumbergs"
