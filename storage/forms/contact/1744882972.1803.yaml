user_message: "Sehr geehrte Damen und Herren,\r\n\r\nich bin in Österreich als Kleinunternehmer tätig und erbringe regelmäßig Dienstleistungen für eine Schweizer GmbH im Rahmen eines monatlichen Retainers. Es handelt sich hierbei um meinen einzigen Kunden in der Schweiz.\r\n\r\nIn diesem Zusammenhang ersuche ich um eine kurze Einschätzung, ob unter diesen Voraussetzungen eine steuerliche Registrierung in der Schweiz erforderlich ist und ob gegebenenfalls eine Meldung an eine Behörde notwendig wäre.\r\n\r\nZudem würde ich mich über Unterstützung hinsichtlich der korrekten Rechnungsstellung freuen – insbesondere, welche Angaben verpflichtend auf der Rechnung enthalten sein müssen.\r\n\r\nIch danke Ihnen im Voraus für Ihre Rückmeldung und Unterstützung.\r\n\r\nMit freundlichen Grüßen\r\nFabian Erdkönig"
