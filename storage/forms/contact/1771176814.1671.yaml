user_message: "Sehr geehrte Damen und Herren\r\n\r\nIch melde mich bei Ihnen in Sachen «Unterlagen Initium Novum AG».\r\n \r\nDie Confia Group AG, die vorher mit A&O Kreston AG fusioniert hat, hatte die Buchhaltung der Gesellschaft Initium Novum AG (vormals Re-Targeting Group AG) geführt. Der Mandatsleiter war damals Herr Christian Feller oder Frau Hanny Bopp.\r\n\r\nWir haben festgestellt, dass wir nur die Unterlagen ab GJ2021 bei uns haben. Die BUHA-Ordner der Vorjahre müssten noch bei Ihnen sein, bzw. bei Confia Group oder bei A&O Kreston?\r\n \r\nGerne möchten wir diese abholen und bei uns lagern. Könnten Sie uns vielleicht weiterhelfen, an wen wir uns wenden könnten?\r\n\r\nBesten Dank.\r\nFreundliche Grüsse,\r\nStanislava Dusa"
