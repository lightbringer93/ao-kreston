user_message: "Guten Tag,\r\n\r\nIch habe kürzlich in der Schweiz gegründet und bin aktuell auf der Suche nach einem zuverlässigen, preislich fairen Treuhänder für meinen Jahresabschluss.\r\n\r\nIch überlege, mit Bexio zu arbeiten, da mir dieses Tool mehrfach empfohlen wurde. Die laufende Buchhaltung plane ich grösstenteils selbst zu führen. Gesucht ist daher vor allem Unterstützung bei:\r\n\r\n* Kontrolle der Buchhaltung\r\n* MWST-Abrechnungen (falls relevant)\r\n* Jahresabschluss\r\n* Steuererklärung\r\n* optional: Beratung bei unternehmerischen Fragen, da ich zum ersten Mal gründe und selbstständig arbeite und sicher noch Fragen zu Abläufen und Prozessen haben werde\r\n\r\nKurz zu meinem Setup:\r\n\r\n* Unternehmensform: bloomimages Switzerland GmbH\r\n* Standort: Schlieren\r\n* Max. 1–3 Buchungen pro Monat\r\n* Branche: Architekturvisualisierung (visueller Content für Architekten, Entwickler und Vermarkter im Immobiliensektor)\r\n\r\nKönnten Sie mir bitte eine grobe Kostenübersicht (Pauschale oder Stundensatz) sowie Ihren Leistungsumfang nennen?\r\nGerne auch mit einem kurzen unverbindlichen Kennenlerngespräch.\r\n\r\nVielen Dank und freundliche Grüsse\r\nTill Krämer"
