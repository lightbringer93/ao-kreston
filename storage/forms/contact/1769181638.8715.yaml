user_message: "Bonjour, \r\n\r\nJe m'appelle Lucía Espallargas et j'aimerais vous poser une question concernant la déclaration d’impôts en 2025, pour voir si vous pouvez m'aider. \r\n\r\nEn 2025, j'ai déménagé en Suisse, j'ai donc travaillé à la fois en Espagne et en Suisse. De plus, je me suis mariée en octobre 2025 et mon conjoint travaille et vit en Suisse depuis janvier 2025. \r\n\r\nDans mon cas, j'ai passé plus de 183 jours en Espagne, mais comme j'ai travaillé en Suisse, je serais obligée de faire ma déclaration de revenus dans les deux pays. De plus, en Suisse, la déclaration est faite conjointement dans le cas des couples mariés. \r\n\r\nUne autre question est que j'ai créé ma propre entreprise individuelle (comme si j'étais indépendante) en décembre, mais je n'ai pas eu de revenus en décembre. À cela s'ajoute également la détention d'actions de la Bourse espagnole et la vente de certaines d'entre elles. \r\n\r\nJ'aimerais savoir si vous pourriez m'aider à remplir la déclaration d'impôts de mon mari et moi en Suisse car Kreston España m'a recommandé de vous contacter.\r\n\r\nMerci beaucoup et cordialement,\r\n\r\nLucía"
