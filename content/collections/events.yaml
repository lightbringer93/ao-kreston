title: Events
sites:
  - de
  - en
  - fr
propagate: false
template: templates/events/show
layout: layout
revisions: false
route:
  de: '/events/{slug}'
  en: '/events/{slug}'
  fr: '/evenements/{slug}'
date: true
sort_dir: asc
date_behavior:
  past: private
  future: public
preview_targets:
  -
    label: Entry
    url: '{permalink}'
    refresh: true
