tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: color
          -
            handle: icon
            field:
              max_files: 1
              display: Icon
              type: assets
              container: assets
              folder: icons
              localizable: true
          -
            handle: short_description
            field:
              display: 'Short Description'
              type: textarea
              localizable: true
          -
            handle: members
            field:
              max_items: 2
              create: false
              collections:
                - team
              type: entries
              display: Team
              localizable: true
