tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: event
            field:
              placeholder: Event
              input_type: hidden
              type: text
              localizable: true
          -
            handle: salutation
            field:
              placeholder: Anrede
              options:
                Herr: Herr
                Frau: Frau
              type: select
              validate:
                - required
              localizable: true
          -
            handle: first_name
            field:
              placeholder: 'First Name'
              type: text
              width: 50
              validate:
                - required
              localizable: true
          -
            handle: last_name
            field:
              placeholder: Nachname
              type: text
              width: 50
              validate:
                - required
              localizable: true
          -
            handle: phone
            field:
              placeholder: Telefonnummer
              type: text
              width: 50
              localizable: true
              validate:
                - required
          -
            handle: email
            field:
              placeholder: 'E-Mail Adresse'
              type: text
              width: 50
              validate:
                - required
                - email
              localizable: true
          -
            handle: company
            field:
              placeholder: Firma
              type: text
              width: 50
              localizable: true
          -
            handle: event_date
            field:
              type: select
              width: 50
              placeholder: Termin
              localizable: true
              validate:
                - required
